name: Publish

# Publishes to pub.dev when a tag such as v0.1.0 is pushed. pub.dev is configured to accept publishing from
# GitHub Actions push events in this repository with the tag pattern v{{version}}.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
